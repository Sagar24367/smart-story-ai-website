<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Smart Story AI - Hindi story prompt creator by Sandeep Sagar">
<title>Smart Story AI | Sandeep Sagar</title>
<style>
:root{color-scheme:dark;--bg:#101426;--panel:#1b2340;--accent:#8b7cff;--text:#f6f7ff;--muted:#b9bfd8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(140deg,#101426,#25204a);color:var(--text);min-height:100vh;padding:24px}
main{max-width:760px;margin:30px auto;background:#171d35eF;border:1px solid #454b70;border-radius:22px;padding:26px;box-shadow:0 18px 60px #0005}
h1{margin:0 0 6px;font-size:clamp(30px,7vw,44px)}.sub{color:var(--muted);margin:0 0 24px}
label{display:block;margin:15px 0 7px;font-weight:650}input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #555d83;background:#10162b;color:white;font:inherit}
textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:white;font-weight:750;font-size:16px;margin-top:18px;cursor:pointer}
#result{white-space:pre-wrap;background:#0d1326;border:1px solid #444c70;border-radius:12px;padding:16px;margin-top:18px;min-height:70px;color:#e8eaff}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
@media(max-width:560px){body{padding:12px}main{padding:19px;margin:12px auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>✨ Smart Story AI</h1>
<p class="sub">अपनी पसंद की हिंदी कहानी के लिए AI प्रॉम्प्ट बनाइए।</p>
<label for="topic">कहानी का विषय</label>
<textarea id="topic" placeholder="जैसे: एक गरीब किसान और जादुई पेड़"></textarea>
<div class="grid">
<div><label for="genre">कहानी का प्रकार</label><select id="genre"><option>लोक कथा</option><option>नैतिक कहानी</option><option>पौराणिक कथा</option><option>परी की कहानी</option><option>जानवरों की कहानी</option><option>रहस्य और रोमांच</option></select></div>
<div><label for="duration">कहानी की अवधि</label><select id="duration"><option>3 मिनट</option><option>5 मिनट</option><option>6 मिनट</option><option>8 मिनट</option><option>10 मिनट</option></select></div>
<div><label for="style">प्रस्तुति शैली</label><select id="style"><option>सिनेमैटिक 3D एनिमेटेड</option><option>सरल और भावनात्मक</option><option>रोमांचक और रहस्यमयी</option></select></div>
<div><label for="audience">दर्शक</label><select id="audience"><option>पूरा परिवार</option><option>बच्चे</option><option>सामान्य हिंदी दर्शक</option></select></div>
</div>
<button onclick="makePrompt()">कहानी का प्रॉम्प्ट बनाएं</button>
<div id="result" aria-live="polite">आपका तैयार प्रॉम्प्ट यहाँ दिखाई देगा।</div>
<button onclick="copyPrompt()">प्रॉम्प्ट कॉपी करें</button>
<footer>Created by Sandeep Sagar</footer>
</main>
<script>
function makePrompt(){
 const topic=document.getElementById('topic').value.trim();
 if(!topic){document.getElementById('result').textContent='कृपया पहले कहानी का विषय लिखें।';return;}
 const genre=document.getElementById('genre').value,duration=document.getElementById('duration').value,style=document.getElementById('style').value,audience=document.getElementById('audience').value;
 document.getElementById('result').textContent=`मेरे लिए ${duration} की एक पूरी हिंदी ${genre} कहानी लिखिए।\nविषय: ${topic}\nशैली: ${style}\nदर्शक: ${audience}\nकहानी की शुरुआत आकर्षक हुक से हो। पात्रों के नाम और व्यक्तित्व स्पष्ट हों। घटनाएँ क्रमबद्ध और रोचक हों। संवाद स्वाभाविक हों। भाषा सरल, शुद्ध और बोलचाल की हिंदी हो। कहानी का अंत संतोषजनक हो। अनावश्यक उपदेश न दें।`;
}
async function copyPrompt(){const t=document.getElementById('result').textContent;try{await navigator.clipboard.writeText(t);alert('प्रॉम्प्ट कॉपी हो गया!');}catch(e){alert('प्रॉम्प्ट को दबाकर चुनें और कॉपी करें।');}}
</script>
</body></html>
